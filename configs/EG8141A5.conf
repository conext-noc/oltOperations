#
[gpon]
  <gpon-{frame}/{slot}>
 interface gpon {frame}/{slot}
 ont add {port} {onu_id} sn-auth "{sn}" omci ont-lineprofile-id {line_profile} ont-srvprofile-id {srv_profile} desc "{name_1} {name_2} {contract}"
 ont ipconfig {port} {onu_id} ip-index {ipconf_index} dhcp vlan {vlan} priority {ipconf_priority}
 ont internet-config {port} {onu_id} ip-index {intconf_index}
 ont wan-config {port} {onu_id} ip-index {wanconf_index} profile-id {wanconf_profile_id}
 ont policy-route-config {port} {onu_id} profile-id {policy_route_conf_prof_id}
 ont fec {port} {onu_id} use-profile-config
#
[bbs-config]
  <bbs-config>
 service-port {spid} vlan {vlan} gpon {frame}/{slot}/{port} ont {onu_id} gemport {gem_port} multi-service user-vlan {vlan} tag-transform transparent inbound traffic-table index {plan_idx} outbound traffic-table index {plan_idx}
#